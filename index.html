async function loadState() {
  try {
    const snap = await db.ref("tripData").get();
    if (snap.exists()) return snap.val();
  } catch(e) {}
  return null;
}
async function saveState(s) {
  try { await db.ref("tripData").set(s); } catch(e) { console.error(e); }
}

const dateLabel = (d) => { const dt = new Date(d + "T00:00:00"); return `${String(dt.getMonth() + 1).padStart(2, "0")}/${String(dt.getDate()).padStart(2, "0")}(${"日一二三四五六"[dt.getDay()]})`; };
const fmtTWD = (n) => "NT$" + Math.round(n || 0).toLocaleString();

function TripPlanner() {
  const [items, setItems] = useState(SEED_ITEMS);
  const [days, setDays] = useState(SEED_DAYS);
  const [infodata, setInfodata] = useState(SEED_INFO);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("days");
  const [editing, setEditing] = useState(null);
  const [dayNoteFor, setDayNoteFor] = useState(null);
  const [showAddDays, setShowAddDays] = useState(false);

  useEffect(() => { loadState().then((s) => { if (s) { setItems(s.items || SEED_ITEMS); setDays(s.days || SEED_DAYS); setInfodata(s.infodata || SEED_INFO); setSettings(s.settings || DEFAULT_SETTINGS); } setLoaded(true); }); }, []);
  const persist = (patch) => saveState({ items, days, infodata, settings, ...patch });

  // 換算成 TWD
  const toTWD = useCallback((amount, cur) => (amount || 0) * (settings.currencies[cur] || 1), [settings]);

  const upsertItem = (it) => {
    let next; if (it.id && items.find((x) => x.id === it.id)) next = items.map((x) => (x.id === it.id ? it : x));
    else next = [...items, { ...it, id: "i" + Date.now() }];
    setItems(next); persist({ items: next }); setEditing(null);
  };
  const removeItem = (id) => { const n = items.filter((x) => x.id !== id); setItems(n); persist({ items: n }); setEditing(null); };
  const addDays = (entries) => {
    const nd = { ...days }; entries.forEach((e) => { if (e.date) nd[e.date] = e.title || ""; });
    setDays(nd); persist({ days: nd }); setShowAddDays(false);
  };
  // 資訊庫：整個地點物件一起更新
  const blankInfo = () => ({ links: [], note: "", summary: "" });
  const updateInfo = (locId, patch) => {
    const cur = infodata[locId] || blankInfo();
    const next = { ...infodata, [locId]: { ...cur, ...patch } };
    setInfodata(next); persist({ infodata: next });
  };
  const addLink = (locId, link) => {
    const cur = infodata[locId] || blankInfo();
    updateInfo(locId, { links: [...cur.links, { ...link, id: "l" + Date.now() }] });
  };
  const delLink = (locId, linkId) => {
    const cur = infodata[locId] || blankInfo();
    updateInfo(locId, { links: cur.links.filter((x) => x.id !== linkId) });
  };
  const saveSettings = (s) => { setSettings(s); persist({ settings: s }); };

  const TABS = [{ k: "days", label: "每日行程" }, { k: "todo", label: "待辦預訂" }, { k: "cost", label: "旅遊費用" }, { k: "info", label: "資訊庫" }, { k: "set", label: "設定" }];

  return (
    <div style={{ fontFamily: "'Georgia','Songti TC',serif", background: PALETTE.bg, color: PALETTE.ink, minHeight: "100vh", padding: "0 0 60px" }}>
      <style>{`
        *{box-sizing:border-box;}
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Noto+Serif+TC:wght@400;600&display=swap');
        .tp-head{font-family:'Playfair Display','Noto Serif TC',serif;}
        .tp-body{font-family:'Noto Serif TC','Georgia',serif;}
        .tp-btn{cursor:pointer;border:none;transition:all .15s;}.tp-btn:hover{filter:brightness(.96);}
        .tp-slot:hover{background:#f0e9db;}
        input,select,textarea{font-family:'Noto Serif TC',serif;}
      `}</style>

      <div className="tp-head" style={{ background: `linear-gradient(105deg,${PALETTE.fr} 0%,${PALETTE.ch} 52%,${PALETTE.it} 100%)`, color: "#fbf8f1", padding: "24px 22px 20px" }}>
        <div style={{ fontSize: 12, letterSpacing: 4, opacity: .85 }}>2026 · 跨國旅程</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginTop: 4 }}>法 · 瑞 · 義 旅程總表</div>
        <div className="tp-body" style={{ fontSize: 13, marginTop: 5, opacity: .9 }}>6/3 – 7/10 · 長輩團 6/13–6/23 同行</div>
      </div>

      <div className="tp-body" style={{ display: "flex", background: PALETTE.paper, borderBottom: `1px solid ${PALETTE.line}`, position: "sticky", top: 0, zIndex: 5 }}>
        {TABS.map((t) => (
          <button key={t.k} className="tp-btn" onClick={() => setTab(t.k)} style={{ flex: 1, padding: "13px 2px", fontSize: 13, fontWeight: tab === t.k ? 600 : 400, background: "transparent", color: tab === t.k ? PALETTE.ink : PALETTE.inkSoft, borderBottom: tab === t.k ? `3px solid ${PALETTE.gold}` : "3px solid transparent" }}>{t.label}</button>
        ))}
      </div>

      <div style={{ padding: "18px 16px 0", maxWidth: 760, margin: "0 auto" }}>
        {!loaded && <div className="tp-body" style={{ textAlign: "center", color: PALETTE.inkSoft, padding: 40 }}>讀取中…</div>}
        {loaded && tab === "days" && <DayCards items={items} days={days} toTWD={toTWD} onEdit={setEditing} onAddSlot={(d, slot) => setEditing({ date: d, type: slot })} onAddDays={() => setShowAddDays(true)} />}
        {loaded && tab === "todo" && <TodoView items={items} toTWD={toTWD} onEdit={setEditing} />}
        {loaded && tab === "cost" && <CostView items={items} settings={settings} toTWD={toTWD} />}
        {loaded && tab === "info" && <InfoLibrary days={days} items={items} infodata={infodata} onOpen={setDayNoteFor} />}
        {loaded && tab === "set" && <Settings settings={settings} onSave={saveSettings} />}
      </div>

      {editing !== null && <ItemEditor item={editing} settings={settings} onSave={upsertItem} onDelete={removeItem} onClose={() => setEditing(null)} />}
      {showAddDays && <AddDaysModal onSave={addDays} onClose={() => setShowAddDays(false)} />}
      {dayNoteFor !== null && <LocInfoModal loc={dayNoteFor} info={infodata[dayNoteFor.id] || { links: [], note: "", summary: "" }} onAddLink={addLink} onDelLink={delLink} onUpdate={updateInfo} onClose={() => setDayNoteFor(null)} />}
    </div>
  );
}

// ===== 每日卡片 =====
function DayCards({ items, days, toTWD, onEdit, onAddSlot, onAddDays }) {
  const allDates = Array.from(new Set([...Object.keys(days), ...items.map((i) => i.date)])).sort();
  return (
    <div className="tp-body">
      <button className="tp-btn" onClick={onAddDays} style={{ width: "100%", padding: 12, marginBottom: 16, borderRadius: 10, background: "transparent", border: `1.5px dashed ${PALETTE.gold}`, color: PALETTE.gold, fontSize: 14, fontWeight: 600 }}>＋ 新增天數（可一次多筆，自動依日期排序）</button>
      {allDates.map((d) => <DayCard key={d} date={d} title={days[d]} dayItems={items.filter((i) => i.date === d)} toTWD={toTWD} onEdit={onEdit} onAddSlot={onAddSlot} />)}
    </div>
  );
}

function DayCard({ date, title, dayItems, toTWD, onEdit, onAddSlot }) {
  const c = COUNTRY[(dayItems[0] || {}).country] || COUNTRY.fr;
  const timed = dayItems.filter((i) => i.time).sort((a, b) => a.time.localeCompare(b.time));
  const lodging = dayItems.filter((i) => i.type === "lodging");
  const dayTotal = dayItems.reduce((s, i) => s + toTWD(i.amount, i.cur), 0);
  const dayBooked = dayItems.filter((i) => i.status === "booked").reduce((s, i) => s + toTWD(i.paidAmount, i.cur), 0);

  return (
    <div style={{ background: PALETTE.paper, borderRadius: 14, marginBottom: 16, boxShadow: "0 1px 5px rgba(60,50,30,.07)", overflow: "hidden", borderTop: `3px solid ${c.color}` }}>
      <div style={{ padding: "12px 16px 10px", borderBottom: `1px solid ${PALETTE.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div>
            <span className="tp-head" style={{ fontSize: 17, fontWeight: 700 }}>{dateLabel(date)}</span>
            <span style={{ fontSize: 11, color: c.color, fontWeight: 600, marginLeft: 8 }}>{c.label}</span>
          </div>
          <span className="tp-head" style={{ fontSize: 14, fontWeight: 700 }}>{fmtTWD(dayTotal)}</span>
        </div>
        {title && <div style={{ fontSize: 13, color: PALETTE.ink, marginTop: 3, fontWeight: 600 }}>{title}</div>}
        {/* 時間軸摘要 */}
        {timed.length > 0 && (
          <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", alignItems: "center", gap: 4, fontSize: 11, color: PALETTE.inkSoft, lineHeight: 1.6 }}>
            {timed.map((it, idx) => (
              <span key={it.id} style={{ display: "inline-flex", alignItems: "center" }}>
                <b style={{ color: PALETTE.ink }}>{it.time}</b>&nbsp;{TYPE[it.type].icon}{it.title}
                {idx < timed.length - 1 && <span style={{ margin: "0 5px", color: PALETTE.gold }}>→</span>}
              </span>
            ))}
          </div>
        )}
      </div>

      <div style={{ display: "flex", borderBottom: lodging.length ? `1px solid ${PALETTE.line}` : "none" }}>
        {SLOTS.map((slot, i) => {
          const hits = dayItems.filter((x) => x.type === slot.key);
          return (
            <div key={slot.key} className="tp-slot" style={{ flex: 1, padding: "10px 8px", borderLeft: i ? `1px solid ${PALETTE.line}` : "none", minHeight: 86, cursor: hits.length ? "default" : "pointer", transition: "background .15s" }} onClick={hits.length ? undefined : () => onAddSlot(date, slot.key)}>
              <div style={{ fontSize: 10, color: PALETTE.inkSoft, marginBottom: 5, textAlign: "center" }}>{slot.icon} {slot.label}</div>

// 計算每筆對某團的「實際負擔」與「結算」
function computeShares(it, settings, toTWD) {
  const total = toTWD(it.amount, it.cur);
  const g = settings.groups;
  if (!it.splitMode || it.splitMode === "none") {
    // 不分攤：全歸 payer（預設小孩團）
    const owner = it.payer || "kid";
    return { kid: owner === "kid" ? total : 0, elder: owner === "elder" ? total : 0, delta: 0 };
  }
  let kidShare = 0, elderShare = 0;
  if (it.splitMode === "head") {
    // 當天兩團是否都在場 -> 大人總數
    const inElder = it.date >= g.elder.start && it.date <= g.elder.end;
    const denom = g.kid.adults + (inElder ? g.elder.adults : 0);
    kidShare = total * g.kid.adults / denom;
    elderShare = inElder ? total * g.elder.adults / denom : 0;
  } else if (it.splitMode === "named") {
    const ng = it.namedGroups && it.namedGroups.length ? it.namedGroups : ["kid"];
    const denom = ng.reduce((s, k) => s + g[k].adults, 0);
    if (ng.includes("kid")) kidShare = total * g.kid.adults / denom;
    if (ng.includes("elder")) elderShare = total * g.elder.adults / denom;
  }
  // 結算：payer 先付全額，另一團該分的部分 => 欠 payer
  const payer = it.payer || "kid";
  let delta = 0; // >0 長輩團欠小孩團；<0 小孩團欠長輩團
  if (payer === "kid") delta = elderShare;      // 小孩團代墊長輩團的份
  else delta = -kidShare;                        // 長輩團代墊小孩團的份
  return { kid: kidShare, elder: elderShare, delta };
}

function CostView({ items, settings, toTWD }) {
  const m = useMemo(() => {
    const total = items.reduce((s, i) => s + toTWD(i.amount, i.cur), 0);
    const spent = items.filter((i) => i.status === "booked").reduce((s, i) => s + toTWD(i.paidAmount, i.cur), 0);
    const cats = ["transport", "ticket", "lodging", "food"];
    const byCat = cats.map((c) => {
      const list = items.filter((i) => i.type === c);
      return { type: c, budget: list.reduce((s, i) => s + toTWD(i.amount, i.cur), 0), spent: list.filter((i) => i.status === "booked").reduce((s, i) => s + toTWD(i.paidAmount, i.cur), 0) };
    });
    // 分攤段
    const shareItems = items.filter((i) => i.splitMode && i.splitMode !== "none");
    const perGroup = { kid: { transport: 0, ticket: 0, lodging: 0, food: 0 }, elder: { transport: 0, ticket: 0, lodging: 0, food: 0 } };
    shareItems.forEach((it) => {
      const r = computeShares(it, settings, toTWD);
      perGroup.kid[it.type] += r.kid; perGroup.elder[it.type] += r.elder;
    });
    return { total, spent, byCat, perGroup, shareCount: shareItems.length };
  }, [items, settings, toTWD]);

  const g = settings.groups;
  const catSum = (obj) => obj.transport + obj.ticket + obj.lodging + obj.food;

  return (
    <div className="tp-body">
      {/* 總覽 */}

            <div className="tp-head" style={{ fontSize: 19, fontWeight: 800, marginTop: 3 }}>{fmtTWD(m.total)}</div>

            <div style={{ fontSize: 11, color: PALETTE.inkSoft }}>已花費</div>
            <div className="tp-head" style={{ fontSize: 19, fontWeight: 800, marginTop: 3, color: PALETTE.green }}>{fmtTWD(m.spent)}</div>
          </div>
        </div>
        <div style={{ fontSize: 11, color: PALETTE.inkSoft, textAlign: "center", marginTop: 8 }}>設定總預算 {fmtTWD(settings.totalBudget)} · 餘 {fmtTWD(settings.totalBudget - m.total)}</div>
      </div>

      {/* 分類 */}
      <div style={{ background: PALETTE.paper, borderRadius: 14, padding: 18, marginBottom: 14, border: `1px solid ${PALETTE.line}` }}>
        <div className="tp-head" style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>分類：總預算 vs 已花費</div>
        {m.byCat.map((c) => (
          <div key={c.type} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
              <span>{TYPE[c.type].icon} {TYPE[c.type].label}</span>
              <span style={{ color: PALETTE.inkSoft }}>已花費 {fmtTWD(c.spent)} / 預算 {fmtTWD(c.budget)}</span>
            </div>
            <div style={{ height: 8, background: PALETTE.line, borderRadius: 6, overflow: "hidden", position: "relative" }}>
              <div style={{ width: `${Math.min(100, c.budget ? c.spent / c.budget * 100 : 0)}%`, height: "100%", background: PALETTE.green, position: "absolute" }} />

// ===== AI 呼叫（artifact 內建）=====
async function callAI(prompt) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
    });
    const data = await res.json();
    return data.content.filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
  } catch (e) { return "（AI 產生失敗，請稍後再試）"; }
}

// 影片連結 -> 嵌入網址
function ytEmbed(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

      </Row>
      <Row>
        <div style={{ flex: 1 }}><div style={lbl}>國家</div><select value={f.country} onChange={(e) => set("country", e.target.value)} style={inp}>{Object.entries(COUNTRY).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></div>
        <div style={{ flex: 1 }}><div style={lbl}>類型</div><select value={f.type} onChange={(e) => set("type", e.target.value)} style={inp}>{Object.entries(TYPE).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}</select></div>
      </Row>
      <div style={{ marginTop: 10 }}><div style={lbl}>名稱</div><input value={f.title} onChange={(e) => set("title", e.target.value)} style={inp} /></div>
      <div style={{ marginTop: 10 }}><div style={lbl}>狀態</div><select value={f.status} onChange={(e) => set("status", e.target.value)} style={inp}>{Object.entries(STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></div>
      <Row>
        <div style={{ width: 90 }}><div style={lbl}>幣別</div><select value={f.cur} onChange={(e) => set("cur", e.target.value)} style={inp}>{Object.keys(settings.currencies).map((k) => <option key={k} value={k}>{k}</option>)}</select></div>
        <div style={{ flex: 1 }}><div style={lbl}>金額（全額）</div><input type="number" value={f.amount} onChange={(e) => set("amount", +e.target.value)} style={inp} /></div>
        <div style={{ flex: 1 }}><div style={lbl}>已付</div><input type="number" value={f.paidAmount} onChange={(e) => set("paidAmount", +e.target.value)} style={inp} /></div>
      </Row>
      <div style={{ fontSize: 11, color: PALETTE.inkSoft, marginTop: 5 }}>≈ {fmtTWD(f.amount * (settings.currencies[f.cur] || 1))}</div>

      {/* 分攤 */}
      <div style={{ marginTop: 14, padding: 12, borderRadius: 10, background: "#faf6f1", border: "1px solid #d8c4dd" }}>
        <div style={{ ...lbl, color: PALETTE.elder }}>分攤計算方式</div>
        <select value={f.splitMode} onChange={(e) => set("splitMode", e.target.value)} style={inp}>
          <option value="none">不分攤（全歸付款方）</option>
          <option value="head">大人人頭（依當天在場大人數平分）</option>
          <option value="named">實名計算（指定哪些團參與）</option>
        </select>
        {f.splitMode !== "none" && (
          <div style={{ marginTop: 10 }}>
            <div style={lbl}>誰先付的</div>
            <select value={f.payer} onChange={(e) => set("payer", e.target.value)} style={inp}>
              <option value="kid">{g.kid.label}先付</option>
              <option value="elder">{g.elder.label}先付</option>
            </select>
            {f.splitMode === "named" && (
              <div style={{ marginTop: 10 }}>
                <div style={lbl}>參與分攤的團</div>
                <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                  {["kid", "elder"].map((k) => (
                    <label key={k} style={{ flex: 1, display: "flex", alignItems: "center", gap: 6, padding: "8px 10px", borderRadius: 8, border: `1px solid ${f.namedGroups.includes(k) ? PALETTE.elder : PALETTE.line}`, background: f.namedGroups.includes(k) ? "#f0e6f2" : "#fff", fontSize: 13, cursor: "pointer" }}>
                      <input type="checkbox" checked={f.namedGroups.includes(k)} onChange={() => toggleNamed(k)} /> {g[k].label}（{g[k].adults}）
                    </label>
                  ))}
                </div>
              </div>
            )}
            {f.splitMode === "head" && <div style={{ fontSize: 11, color: PALETTE.elder, marginTop: 8 }}>系統會依 {f.date} 當天兩團在場的大人總數自動平分。</div>}
          </div>
        )}
      </div>

      <div style={{ marginTop: 10 }}><div style={lbl}>訂單編號</div><input value={f.ref} onChange={(e) => set("ref", e.target.value)} style={inp} /></div>
      <div style={{ marginTop: 10 }}><div style={lbl}>票券 / QRcode 連結（Google Drive）</div><input value={f.qr} placeholder="https://drive.google.com/…" onChange={(e) => set("qr", e.target.value)} style={inp} /></div>
      <div style={{ fontSize: 11, color: f.ref && f.qr ? PALETTE.green : PALETTE.inkSoft, marginTop: 5 }}>{f.ref && f.qr ? "✓ 已有訂單編號＋連結，待辦會自動標記完成" : "填入訂單編號＋Drive 連結後，此項會在待辦自動標完成"}</div>
      <div style={{ marginTop: 10 }}><div style={lbl}>備註</div><textarea value={f.note} onChange={(e) => set("note", e.target.value)} style={{ ...inp, minHeight: 50, resize: "vertical" }} /></div>
      {f.qr && <a href={f.qr} target="_blank" rel="noreferrer" style={{ display: "inline-block", marginTop: 10, color: PALETTE.gold, fontSize: 13 }}>🔗 開啟票券連結</a>}
      <EditorButtons hasId={!!item.id} onSave={() => onSave(f)} onDelete={() => onDelete(item.id)} onClose={onClose} />
    </Modal>
  );
}

function AddDaysModal({ onSave, onClose }) {
  const [rows, setRows] = useState([{ date: "", title: "" }]);
  const inp = { width: "100%", padding: "9px 11px", borderRadius: 8, border: `1px solid ${PALETTE.line}`, fontSize: 14, background: "#fff" };
  const set = (i, k, v) => setRows((p) => p.map((r, idx) => (idx === i ? { ...r, [k]: v } : r)));
  return (
    <Modal onClose={onClose} title="新增天數（可多筆）">
      <div style={{ fontSize: 12, color: PALETTE.inkSoft, marginBottom: 12 }}>填日期與當天大標，例如 06/03 → 台北→巴黎。儲存後自動依日期排序。</div>
      {rows.map((r, i) => (
        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <input type="date" value={r.date} onChange={(e) => set(i, "date", e.target.value)} style={{ ...inp, width: 150 }} />
          <input placeholder="當天大標" value={r.title} onChange={(e) => set(i, "title", e.target.value)} style={inp} />
        </div>
      ))}
      <button className="tp-btn" onClick={() => setRows([...rows, { date: "", title: "" }])} style={{ width: "100%", padding: 9, borderRadius: 8, background: "transparent", border: `1.5px dashed ${PALETTE.gold}`, color: PALETTE.gold, fontSize: 13, marginTop: 4 }}>＋ 再加一列</button>
      <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
        <button className="tp-btn" onClick={() => onSave(rows)} style={{ flex: 1, padding: 12, borderRadius: 10, background: PALETTE.ink, color: "#fbf8f1", fontSize: 15, fontWeight: 600 }}>儲存</button>
        <button className="tp-btn" onClick={onClose} style={{ padding: "12px 16px", borderRadius: 10, background: PALETTE.line, fontSize: 14 }}>取消</button>
      </div>
    </Modal>
  );
}

function LocInfoModal({ loc, info, onAddLink, onDelLink, onUpdate, onClose }) {
  const [nl, setNl] = useState({ title: "", cat: "general", url: "" }); // 新連結
  const [note, setNote] = useState(info.note || "");
  const [busy, setBusy] = useState(false);
  const inp = { width: "100%", padding: "9px 11px", borderRadius: 8, border: `1px solid ${PALETTE.line}`, fontSize: 14, background: "#fff", marginTop: 4 };
  const lbl = { fontSize: 12, color: PALETTE.inkSoft, fontWeight: 600 };
  const place = loc.title;

  const addLink = () => {
    if (!nl.title && !nl.url) return;
    onAddLink(loc.id, { title: nl.title || nl.url, cat: nl.cat, url: nl.url });
    setNl({ title: "", cat: "general", url: "" });
  };
  const saveNote = () => onUpdate(loc.id, { note });
  const genSummary = async () => {
    setBusy(true);
    const linkList = info.links.map((l, i) => `${i + 1}. [${(INFO_CAT[l.cat] || INFO_CAT.general).label}] ${l.title}${l.url ? " (" + l.url + ")" : ""}`).join("\n") || "（無連結）";
    const txt = await callAI(`你是懂門路的旅遊朋友。以下是我為「${place}」收集的資料。請用繁體中文寫一段「速讀總覽」(約 2–4 句)，幫我快速掌握這個地點該注意什麼、最佳安排(例如推薦的到訪時段、哪個入口、要避開什麼)。\n注意：你只看得到連結標題與我的筆記，看不到連結內頁，請據此歸納並可點出還缺哪類資訊。只回總覽本身，不要前言。\n\n【收集的連結】\n${linkList}\n\n【我的筆記】\n${note || "（無）"}`);
    onUpdate(loc.id, { summary: txt });
    setBusy(false);
  };

  return (
    <Modal onClose={onClose} title={`${TYPE[loc.type].icon} ${place}`}>
      <div style={{ fontSize: 12, color: PALETTE.inkSoft, marginTop: -8, marginBottom: 14 }}>{dateLabel(loc.date)} · {(COUNTRY[loc.country] || {}).label}</div>

      {/* 第一層：連結櫃 */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>🔗 連結櫃</div>
        {info.links.length === 0 && <div style={{ fontSize: 12, color: "#c9bda8", marginBottom: 8 }}>還沒有連結，從下方加入第一個。</div>}
        {info.links.map((l) => {
          const cat = INFO_CAT[l.cat] || INFO_CAT.general;
          const embed = ytEmbed(l.url);
          return (
            <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#f7f2ea", borderRadius: 10, padding: "9px 11px", marginBottom: 7 }}>
              <span style={{ fontSize: 10, padding: "1px 7px", borderRadius: 20, background: "#fff", color: PALETTE.inkSoft, whiteSpace: "nowrap" }}>{cat.icon}{cat.label}</span>
              <a href={l.url || "#"} target="_blank" rel="noreferrer" onClick={(e) => { if (!l.url) e.preventDefault(); }} style={{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 600, color: l.url ? PALETTE.gold : PALETTE.ink, textDecoration: "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{embed ? "▶ " : l.url ? "🔗 " : ""}{l.title}</a>
              <span className="tp-btn" onClick={() => onDelLink(loc.id, l.id)} style={{ fontSize: 11, color: PALETTE.red, whiteSpace: "nowrap" }}>刪</span>
            </div>
          );
        })}
        {/* 加連結 */}
        <div style={{ background: "#fff", border: `1px dashed ${PALETTE.gold}`, borderRadius: 10, padding: 12, marginTop: 8 }}>
          <input value={nl.title} placeholder="連結名稱（例：Klook 免排隊攻略）" onChange={(e) => setNl({ ...nl, title: e.target.value })} style={{ ...inp, marginTop: 0 }} />
          <input value={nl.url} placeholder="https://…（網頁 / 地圖 / YouTube）" onChange={(e) => setNl({ ...nl, url: e.target.value })} style={inp} />
          <div style={{ display: "flex", gap: 5, marginTop: 8 }}>
            {Object.entries(INFO_CAT).map(([k, v]) => (
              <button key={k} className="tp-btn" onClick={() => setNl({ ...nl, cat: k })} style={{ flex: 1, padding: "6px 2px", borderRadius: 7, fontSize: 10.5, background: nl.cat === k ? PALETTE.gold : "#faf6ee", color: nl.cat === k ? "#fff" : PALETTE.inkSoft, border: `1px solid ${nl.cat === k ? PALETTE.gold : PALETTE.line}` }}>{v.icon}{v.label}</button>
            ))}
          </div>
          <button className="tp-btn" onClick={addLink} style={{ width: "100%", padding: 9, borderRadius: 8, background: PALETTE.gold, color: "#fff", fontSize: 13, fontWeight: 600, marginTop: 10 }}>＋ 加入連結</button>
        </div>
      </div>

      {/* 第二層：我的筆記 */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>📝 我的筆記</div>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} onBlur={saveNote} placeholder="自己的想法、提醒（例：記得帶學生證）。也可把文章內文貼這裡，AI 速讀會更準。" style={{ ...inp, marginTop: 0, minHeight: 70, resize: "vertical" }} />
        <div style={{ fontSize: 11, color: PALETTE.inkSoft, marginTop: 4 }}>離開輸入框自動儲存</div>
      </div>

      {/* 第三層：AI 速讀 */}
      <div style={{ background: "#f3eee2", borderRadius: 10, padding: "12px 14px", border: `1px solid ${PALETTE.gold}33` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: PALETTE.gold }}>⚡ 此地點 AI 速讀</span>
          <button className="tp-btn" disabled={busy || (!info.links.length && !note)} onClick={genSummary} style={{ fontSize: 12, padding: "5px 12px", borderRadius: 20, background: (info.links.length || note) ? PALETTE.gold : PALETTE.line, color: "#fff", fontWeight: 600 }}>{busy ? "產生中…" : info.summary ? "重新產生" : "產生速讀"}</button>
        </div>
        {info.summary ? <div style={{ fontSize: 13, color: PALETTE.ink, marginTop: 8, lineHeight: 1.7 }}>{info.summary}</div>
          : <div style={{ fontSize: 12, color: PALETTE.inkSoft, marginTop: 6 }}>{(info.links.length || note) ? "讀完連結標題＋你的筆記後產出速讀" : "先加連結或寫筆記"}</div>}
        <div style={{ fontSize: 10.5, color: PALETTE.inkSoft, marginTop: 8, lineHeight: 1.5 }}>※ 網頁 AI 看不到連結內頁，速讀依連結標題＋你的筆記歸納。要逐篇讀完內容，可把連結丟回對話讓我代讀。</div>
      </div>
    </Modal>
  );
}

function Modal({ children, title, onClose }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(40,33,25,.45)", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div className="tp-body" onClick={(e) => e.stopPropagation()} style={{ background: PALETTE.paper, borderRadius: "18px 18px 0 0", padding: 22, width: "100%", maxWidth: 560, maxHeight: "90vh", overflowY: "auto" }}>
        <div className="tp-head" style={{ fontSize: 18, fontWeight: 600, marginBottom: 16 }}>{title}</div>
        {children}
      </div>
    </div>
  );
}
function Row({ children }) { return <div style={{ display: "flex", gap: 10, marginTop: 10 }}>{children}</div>; }
function EditorButtons({ hasId, onSave, onDelete, onClose }) {
  return (
    <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
      <button className="tp-btn" onClick={onSave} style={{ flex: 1, padding: 12, borderRadius: 10, background: PALETTE.ink, color: "#fbf8f1", fontSize: 15, fontWeight: 600 }}>儲存</button>
      {hasId && <button className="tp-btn" onClick={onDelete} style={{ padding: "12px 16px", borderRadius: 10, background: "#f6e3df", color: PALETTE.red, fontSize: 14 }}>刪除</button>}
      <button className="tp-btn" onClick={onClose} style={{ padding: "12px 16px", borderRadius: 10, background: PALETTE.line, color: PALETTE.ink, fontSize: 14 }}>取消</button>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(TripPlanner));

  </script>
</body>
